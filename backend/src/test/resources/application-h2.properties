spring.application.name=backend-test

# In-memory DB for portable tests
spring.datasource.url=jdbc:h2:mem:healthcare_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Redis (optional; connections are typically lazy)
spring.redis.host=localhost
spring.redis.port=6379

# AI Server (not used in these tests)
ai.server.base-url=http://127.0.0.1:8000







