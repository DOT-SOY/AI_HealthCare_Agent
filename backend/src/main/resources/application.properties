spring.application.name=backend

# MariaDB
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=jdbc:mariadb://localhost:3306/healthcare?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
spring.datasource.username=healthuser
spring.datasource.password=healthuser


spring.jpa.properties.hibernate.format_sql=true


# SQL 로그 출력
spring.jpa.show-sql=true


spring.jpa.hibernate.ddl-auto=update


# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Redis 설정
spring.redis.host=localhost
spring.redis.port=6379

# Refresh Token 저장소: redis(기본) | db
refresh.token.storage=db

# 파일 저장소 설정
file.storage.root-location=uploads
file.storage.base-url=http://localhost:8080/api/files/view

# Multipart 파일 업로드 설정
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# Toss Payments
toss.payments.client-key=${TOSS_CLIENT_KEY}
toss.payments.secret-key=${TOSS_SECRET_KEY}
toss.payments.success-url=${TOSS_SUCCESS_URL}
toss.payments.fail-url=${TOSS_FAIL_URL}


# AI Server
ai.server.base-url=http://localhost:8000

# Product Recommendation Configuration
recommendation.candidate-pool-limit=500
recommendation.bucket-popular-size=30
recommendation.bucket-new-size=20
recommendation.top-candidates-target=50
recommendation.final-count=3
recommendation.popularity-group-threshold=0.05

server.port=8080

# OpenAI (OCR Vision) - .env의 OPENAI_API_KEY, OPENAI_MODEL 사용 가능
# openai.api-key=
# openai.model=gpt-4o-mini

# 인바디 영역 기반 OCR: 단백질(파란 박스)/무기질(빨간 박스)만 해당 영역 크롭 후 Vision으로 추출 (비율 0.0~1.0)
# 설정 시 해당 영역에서만 숫자를 읽어 정확도 향상. 미설정 시 기존처럼 전체 이미지에서만 추출.
inbody.region.protein.enabled=true
inbody.region.protein.x=0.14
inbody.region.protein.y=0.17
inbody.region.protein.w=0.32
inbody.region.protein.h=0.055
inbody.region.minerals.enabled=true
inbody.region.minerals.x=0.14
inbody.region.minerals.y=0.235
inbody.region.minerals.w=0.32
inbody.region.minerals.h=0.055